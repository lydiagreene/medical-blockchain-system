version: "3.9"

services:

  # ── PostgreSQL database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: verifydoc
      POSTGRES_USER: verifydoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verifydoc_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifydoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django + Gunicorn ───────────────────────────────────────
  django:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://verifydoc:${POSTGRES_PASSWORD:-verifydoc_dev}@db:5432/verifydoc
      DEBUG: "False"
    volumes:
      - media_data:/app/media
      - log_data:/app/logs
      - static_data:/app/staticfiles   # collectstatic output shared with nginx
    expose:
      - "8000"

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - django
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro   # mount your certs here in production

volumes:
  postgres_data:
  media_data:
  log_data:
  static_data:
